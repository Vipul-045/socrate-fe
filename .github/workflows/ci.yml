# Every PR and every push to main: the build Vercel runs, run first.
# Branch protection on main requires this job.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Site · type-check + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit
      # No lint step: `npm run lint` is `next lint`, which Next 16 removed,
      # and the site has no ESLint config of its own yet.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Production build (as Vercel)
        run: npm run build
        env:
          # next.config.ts refuses a build without it, or with a localhost one.
          SOCRATE_APP_URL: https://app.socrate.in
          NEXT_PUBLIC_BACKENDBASEURL: https://api.socrate.in
